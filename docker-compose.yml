services:
  astro:
    image: node:22
    working_dir: /app
    entrypoint: sh -c "npm install -g npm@latest --quiet && exec \"$@\"" --
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --force"
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

volumes:
  node_modules: